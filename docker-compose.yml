# Local services for development: `docker compose up -d`
# The site itself runs with `pnpm dev`; these are the backing services it can use.
services:
  redis:
    image: redis:8.8.3-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ['6379:6379']
    volumes: [redis:/data]

  mysql:
    image: mysql:8.4
    ports: ['3306:3306']
    environment:
      MYSQL_DATABASE: shiqi
      MYSQL_USER: shiqi
      MYSQL_PASSWORD: shiqi
      MYSQL_ROOT_PASSWORD: shiqi
    volumes: [mysql:/var/lib/mysql]

  kafka:
    image: apache/kafka:4.3.1
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [kafka:/var/lib/kafka/data]

  # Production-like run of the site from its Docker image.
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['3000:3000']
    environment:
      REDIS_URL: redis://redis:6379
      MYSQL_URL: mysql://shiqi:shiqi@mysql:3306/shiqi
    depends_on: [redis, mysql]

volumes:
  redis:
  mysql:
  kafka:
