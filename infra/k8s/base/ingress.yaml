# HTTPS for shiqi.si and www.shiqi.si via cert-manager (Let's Encrypt, HTTP-01)
# on k3s's built-in Traefik. www and plain HTTP redirect to https://shiqi.si.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
spec:
  redirectRegex:
    regex: ^https?://www\.shiqi\.si/(.*)
    replacement: https://shiqi.si/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: shiqi-redirect-www@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shiqi.si, www.shiqi.si]
      secretName: shiqi-si-tls
  rules:
    - host: shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
    - host: www.shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
---
# Plain HTTP: redirect everything to HTTPS. The ACME challenge path that
# cert-manager adds is more specific, so it still wins during issuance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: shiqi-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
    - host: www.shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
