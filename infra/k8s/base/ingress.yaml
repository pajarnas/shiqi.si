# HTTPS for shiqi.si and www.shiqi.si on k3s's built-in Traefik, which gets
# Let's Encrypt certificates itself (resolver `le`, set up by bootstrap.sh). www and plain HTTP redirect to https://shiqi.si.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
spec:
  redirectRegex:
    regex: ^https?://www\.shiqi\.si/(.*)
    replacement: https://shiqi.si/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
    traefik.ingress.kubernetes.io/router.middlewares: shiqi-redirect-www@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
    - host: www.shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
---
# Plain HTTP: redirect everything to HTTPS. Traefik's own ACME challenge
# router outranks this one, so certificate issuance still works.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: shiqi-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
    - host: www.shiqi.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
