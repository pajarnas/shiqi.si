# Production stack for a small VM: the site, Redis, MySQL, and Caddy for HTTPS.
# bootstrap.sh writes .env next to this file (IMAGE, ACME_EMAIL) and ensure-env.sh
# adds ADMIN_PASSWORD; deploy.sh updates IMAGE. Run from this folder: `docker compose ps`, `docker compose logs -f web`.
name: shiqi

services:
  web:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # MYSQL_PASSWORD comes from secrets.env (GitHub Secret APP_MYSQL_PASSWORD);
      # don't set it here, entries in environment: override env_file.
      MYSQL_HOST: mysql
      MYSQL_USER: shiqi
      MYSQL_DATABASE: shiqi
      # Password for /admin/visits; the page is off while it is empty.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TIME_ZONE: ${ADMIN_TIME_ZONE:-America/New_York}
    # API keys live in secrets.env next to this file (never in git), e.g.
    # AZURE_TRANSLATOR_KEY=... for the translation service. CI fills it from
    # GitHub Secrets named APP_<NAME> (see infra/deploy.sh).
    env_file:
      - path: secrets.env
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on: [redis, mysql]

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis:/data]
    mem_limit: 96m

  # Visitor log and future app data. Tuned to idle at well under 200 MB:
  # no performance_schema, a 32 MB buffer pool, few connections.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --max-connections=20
      - --table-open-cache=256
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --thread-cache-size=4
      - --skip-name-resolve
    # The app user's password comes from secrets.env (APP_MYSQL_PASSWORD) and is
    # fixed when the data volume is first created. Root gets a random password
    # nobody needs; use `docker compose exec mysql mysql -ushiqi -p` instead.
    environment:
      MYSQL_DATABASE: shiqi
      MYSQL_USER: shiqi
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    env_file:
      - path: secrets.env
        required: false
    volumes: [mysql:/var/lib/mysql]
    mem_limit: 320m
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 30s
      timeout: 5s
      start_period: 60s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on: [web]

volumes:
  redis:
  mysql:
  caddy_data:
  caddy_config:
