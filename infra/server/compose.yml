# Production stack for a small VM: the site, Redis, and Caddy for HTTPS.
# bootstrap.sh writes .env next to this file (IMAGE, ACME_EMAIL); deploy.sh
# updates IMAGE. Run from this folder: `docker compose ps`, `docker compose logs -f web`.
name: shiqi

services:
  web:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on: [redis]

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis:/data]
    mem_limit: 96m

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on: [web]

volumes:
  redis:
  caddy_data:
  caddy_config:
