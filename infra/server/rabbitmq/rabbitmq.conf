# RabbitMQ settings for shiqi.si (compose service `rabbitmq`), on top of the
# image's defaults. The certificates and definitions.json come from certs.sh.

# AMQP for the web app inside Docker (password login), AMQPS for your own
# computer through the SSH tunnel: a client certificate is required and its
# common name is the user name (EXTERNAL login, no password).
listeners.tcp.default = 5672
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/server.crt
ssl_options.keyfile = /certs/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_cert_login_from = common_name
auth_mechanisms.1 = EXTERNAL
auth_mechanisms.2 = PLAIN

management.tcp.port = 15672

# Users, permissions and the lab topology, rewritten by certs.sh.
definitions.import_backend = local_filesystem
definitions.local.path = /certs/definitions.json

# The container may use 512 MB (it idles at ~150); block publishers at 60%.
total_memory_available_override_value = 512MB
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 500MB

# Small enough that a test message is never written as a separate file.
queue_index_embed_msgs_below = 4096
